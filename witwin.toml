id = "witwin.radar"
name = "Radar"
version = "0.1.0"
author = ""
description = "FMCW radar simulation from Studio meshes with signal visualization."
license = "GPL-3.0-or-later"
repository = "https://github.com/witwin-ai/wt_radar"
dependencies = ["scipy", "numpy"]
icon = "radar"
enabled = true

[engines]
witwin = "^1.0.0"

[[contributes.solvers]]
id = "witwin.radar.simulate"
title = "Radar FMCW"
entry = "solver_host.py"
lifecycle = "warm"
idleTimeoutSec = 300
cancelGraceSec = 5
maxParallel = 1

[contributes.solvers.runtime]
python = "${backend:python}"

[contributes.solvers.capabilities]
cancel = true
partials = true
query = ["raw_signal", "range_doppler", "point_cloud", "music"]
