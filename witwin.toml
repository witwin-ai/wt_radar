id = "witwin.radar"
name = "Radar"
version = "0.1.1"
author = ""
description = "FMCW radar simulation from Studio meshes with signal visualization."
license = "GPL-3.0-or-later"
repository = "https://github.com/witwin-ai/wt_radar"
dependencies = [
    "scipy",
    "numpy",
    "witwin-radar>=0.4,<0.5",
    "witwin-channel>=0.5,<0.6",
]
icon = "radar"
enabled = true
# The web half only draws recording plots in the Properties plot widget.
# studio.em: the EM fields of Material and the Receiver component (2026-11-03).
pluginDependencies = [{ id = "studio.properties", optional = true }, { id = "studio.em" }]

[engines]
witwin = "^2.0.0"

[[contributes.tools]]
module = "agent_tools"
register = "register"

[permissions]
tools = ["read", "soft_write", "scene_write", "execute", "file_write"]
frontend = true

[web]
root = "frontend"

[[contributes.solvers]]
id = "witwin.radar.simulate"
title = "Radar FMCW"
entry = "solver_host.py"
lifecycle = "warm"
idleTimeoutSec = 300
cancelGraceSec = 5
maxParallel = 1

[contributes.solvers.runtime]
python = "${project:python}"

[contributes.solvers.capabilities]
cancel = true
partials = true
query = ["snapshot_view", "animation_view", "animation_export", "animation_replay", "animation_manifest"]

[contributes.viewport.host]
entry = "viewport.mjs"
sdkVersion = "2.0.0"

# A Project template (Studio's template cards). The payload is copied as-is;
# every file is checked against the content manifest, whose sha256 is pinned
# here. Rebuild both with studio/scripts/build-template-manifest.mjs.
[[contributes.templates]]
id = "radar-sim"
title = "Radar Sim"
description = "A 77 GHz FMCW radar on a road, aimed at a car 6 m ahead."
icon = "radar"
version = "1.2.0"
dir = "templates/radar-sim"
manifest = "template.manifest.json"
sha256 = "ff71f0726b8f83ad507147991465de0a9bb18b38bfa66f985c45ed0a3ffcb0f6"
